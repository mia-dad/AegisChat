<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牛马AI - 智能体控制台</title>
    <!-- 
      修复说明：
      1. 移除了 Google Fonts (fonts.googleapis.com)，避免国内网络环境下请求超时导致页面白屏/黑屏。
      2. 移除了 <script type="importmap">。本地开发(Vite/Webpack)应使用 node_modules 中的依赖，
         混用 CDN 和本地构建会导致 React 实例冲突或加载错误。
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // 使用系统默认字体栈，无需网络加载，速度最快
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
              mono: ['Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
            },
            colors: {
              // 自定义科技风格色盘
              tech: {
                50: '#f0fdfa', // Teal-50
                100: '#ccfbf1',
                200: '#99f6e4',
                300: '#5eead4',
                400: '#2dd4bf',
                500: '#14b8a6', // Primary Brand
                600: '#0d9488',
                700: '#0f766e',
                800: '#115e59',
                900: '#134e4a',
                950: '#042f2e',
              },
              zinc: {
                850: '#1f2025', // Custom dark bg
                950: '#09090b', // Deepest
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #09090b; /* Zinc 950 */
        color: #e4e4e7; /* Zinc 200 */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
